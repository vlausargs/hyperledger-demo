# Fabric network: orderer, 3 peers (CouchDB state DB), 4 CAs (PostgreSQL backend).
# Runnable as one-shot bring-up; expects crypto-config + channel-artifacts produced
# by deployment scripts under fabric-network/scripts/deployment/ (001..008).
#
# TODO: deployment scripts must populate ../../fabric-network/organizations and
# ../../fabric-network/channel-artifacts (genesis.block, channel.tx, anchor txs)
# before this compose comes up. Connection profiles consumed by the API layer
# live at ../../fabric-network/client/crypto-<MSP>/connection-profile.yaml.

x-fabric-env: &fabric-env
  FABRIC_LOGGING_SPEC: ${FABRIC_LOGGING_SPEC:-INFO}
  FABRIC_CFG_PATH: /etc/hyperledger/fabric

x-peer-base: &peer-base
  image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.15}
  restart: unless-stopped
  environment:
    <<: *fabric-env
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_network
    CORE_LEDGER_STATE_STATEDATABASE: CouchDB
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_GOSSIP_USELEADERELECTION: "true"
    CORE_PEER_GOSSIP_ORGLEADER: "false"
    CORE_PEER_PROFILE_ENABLED: "false"
    CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    CORE_METRICS_PROVIDER: prometheus
  networks:
    - fabric_network
  volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - ../../fabric-network/config:/etc/hyperledger/fabric:ro

x-ca-base: &ca-base
  image: hyperledger/fabric-ca:${CA_VERSION:-1.5.5}
  restart: unless-stopped
  command: sh -c 'fabric-ca-server start -b "$$FABRIC_CA_SERVER_CA_BOOTSTRAP_USER:$$FABRIC_CA_SERVER_CA_BOOTSTRAP_PASS" -d'
  networks:
    - fabric_network

x-postgres-ca-base: &postgres-ca-base
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-fabric}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
  networks:
    - fabric_network
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  # ---------------- Orderer ----------------
  orderer:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.15}
    restart: unless-stopped
    environment:
      <<: *fabric-env
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    volumes:
      # TODO: populated by 005-deploy-orderer.sh + 004-generate-configtx.sh
      - ../../fabric-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - ../../fabric-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer_data:/var/hyperledger/production/orderer
    networks:
      - fabric_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/7050"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------- Peers + CouchDBs ----------------
  couchdb0:
    image: couchdb:3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "5984:5984"
    volumes:
      - couchdb0_data:/opt/couchdb/data
    networks:
      - fabric_network

  peer0-org1:
    <<: *peer-base
    depends_on:
      - couchdb0
      - orderer
    environment:
      <<: *fabric-env
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_network
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb0:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-admin}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0-org1:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0-org1:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0-org1:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0-org1:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CORE_METRICS_PROVIDER: prometheus
    ports:
      - "7051:7051"
      - "9445:9445"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../../fabric-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/peer/msp:ro
      - ../../fabric-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/peer/tls:ro
      - peer0_org1_data:/var/hyperledger/production
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/7051"]
      interval: 15s
      timeout: 5s
      retries: 5

  couchdb1:
    image: couchdb:3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "6984:5984"
    volumes:
      - couchdb1_data:/opt/couchdb/data
    networks:
      - fabric_network

  peer0-org2:
    <<: *peer-base
    depends_on:
      - couchdb1
      - orderer
    environment:
      <<: *fabric-env
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_network
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb1:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-admin}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
      CORE_PEER_ID: peer0.org2.example.com
      CORE_PEER_ADDRESS: peer0-org2:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0-org2:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0-org2:8051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0-org2:8051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
      CORE_METRICS_PROVIDER: prometheus
    ports:
      - "8051:8051"
      - "9446:9446"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../../fabric-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/etc/hyperledger/peer/msp:ro
      - ../../fabric-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls:/etc/hyperledger/peer/tls:ro
      - peer0_org2_data:/var/hyperledger/production
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8051"]
      interval: 15s
      timeout: 5s
      retries: 5

  couchdb2:
    image: couchdb:3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "7984:5984"
    volumes:
      - couchdb2_data:/opt/couchdb/data
    networks:
      - fabric_network

  peer0-org3:
    <<: *peer-base
    depends_on:
      - couchdb2
      - orderer
    environment:
      <<: *fabric-env
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_network
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb2:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-admin}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
      CORE_PEER_ID: peer0.org3.example.com
      CORE_PEER_ADDRESS: peer0-org3:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0-org3:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0-org3:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0-org3:9051
      CORE_PEER_LOCALMSPID: Org3MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
      CORE_METRICS_PROVIDER: prometheus
    ports:
      - "9051:9051"
      - "9447:9447"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../../fabric-network/organizations/peerOrganizations/org3.example.com/peers/peer0.org3.example.com/msp:/etc/hyperledger/peer/msp:ro
      - ../../fabric-network/organizations/peerOrganizations/org3.example.com/peers/peer0.org3.example.com/tls:/etc/hyperledger/peer/tls:ro
      - peer0_org3_data:/var/hyperledger/production
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9051"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------- Postgres backends (one per CA for blast-radius isolation) ----------------
  postgres-ca-org1:
    <<: *postgres-ca-base
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
      POSTGRES_DB: fabric_ca_org1
    volumes:
      - postgres_ca_org1_data:/var/lib/postgresql/data

  postgres-ca-org2:
    <<: *postgres-ca-base
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
      POSTGRES_DB: fabric_ca_org2
    volumes:
      - postgres_ca_org2_data:/var/lib/postgresql/data

  postgres-ca-org3:
    <<: *postgres-ca-base
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
      POSTGRES_DB: fabric_ca_org3
    volumes:
      - postgres_ca_org3_data:/var/lib/postgresql/data

  postgres-ca-orderer:
    <<: *postgres-ca-base
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
      POSTGRES_DB: fabric_ca_orderer
    volumes:
      - postgres_ca_orderer_data:/var/lib/postgresql/data

  # ---------------- CAs ----------------
  ca-org1:
    <<: *ca-base
    depends_on:
      - postgres-ca-org1
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org1
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: 7054
      FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      FABRIC_CA_SERVER_DB_TYPE: postgres
      FABRIC_CA_SERVER_DB_DATASOURCE: host=postgres-ca-org1 port=5432 user=${POSTGRES_USER:-fabric} password=${POSTGRES_PASSWORD:-fabric} dbname=fabric_ca_org1 sslmode=disable
      FABRIC_CA_SERVER_CA_BOOTSTRAP_USER: ${CA_ADMIN_USER:-admin}
      FABRIC_CA_SERVER_CA_BOOTSTRAP_PASS: ${CA_ADMIN_PASS:-adminpw}
    ports:
      - "7054:7054"
    volumes:
      - ca_org1_data:/etc/hyperledger/fabric-ca-server

  ca-org2:
    <<: *ca-base
    depends_on:
      - postgres-ca-org2
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org2
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: 8054
      FABRIC_CA_SERVER_DB_TYPE: postgres
      FABRIC_CA_SERVER_DB_DATASOURCE: host=postgres-ca-org2 port=5432 user=${POSTGRES_USER:-fabric} password=${POSTGRES_PASSWORD:-fabric} dbname=fabric_ca_org2 sslmode=disable
      FABRIC_CA_SERVER_CA_BOOTSTRAP_USER: ${CA_ADMIN_USER:-admin}
      FABRIC_CA_SERVER_CA_BOOTSTRAP_PASS: ${CA_ADMIN_PASS:-adminpw}
    ports:
      - "8054:8054"
    volumes:
      - ca_org2_data:/etc/hyperledger/fabric-ca-server

  ca-org3:
    <<: *ca-base
    depends_on:
      - postgres-ca-org3
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org3
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: 9054
      FABRIC_CA_SERVER_DB_TYPE: postgres
      FABRIC_CA_SERVER_DB_DATASOURCE: host=postgres-ca-org3 port=5432 user=${POSTGRES_USER:-fabric} password=${POSTGRES_PASSWORD:-fabric} dbname=fabric_ca_org3 sslmode=disable
      FABRIC_CA_SERVER_CA_BOOTSTRAP_USER: ${CA_ADMIN_USER:-admin}
      FABRIC_CA_SERVER_CA_BOOTSTRAP_PASS: ${CA_ADMIN_PASS:-adminpw}
    ports:
      - "9054:9054"
    volumes:
      - ca_org3_data:/etc/hyperledger/fabric-ca-server

  ca-orderer:
    <<: *ca-base
    depends_on:
      - postgres-ca-orderer
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-orderer
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: 10054
      FABRIC_CA_SERVER_DB_TYPE: postgres
      FABRIC_CA_SERVER_DB_DATASOURCE: host=postgres-ca-orderer port=5432 user=${POSTGRES_USER:-fabric} password=${POSTGRES_PASSWORD:-fabric} dbname=fabric_ca_orderer sslmode=disable
      FABRIC_CA_SERVER_CA_BOOTSTRAP_USER: ${CA_ADMIN_USER:-admin}
      FABRIC_CA_SERVER_CA_BOOTSTRAP_PASS: ${CA_ADMIN_PASS:-adminpw}
    ports:
      - "10054:10054"
    volumes:
      - ca_orderer_data:/etc/hyperledger/fabric-ca-server

networks:
  fabric_network:
    name: fabric_network
    driver: bridge

volumes:
  orderer_data:
  peer0_org1_data:
  peer0_org2_data:
  peer0_org3_data:
  couchdb0_data:
  couchdb1_data:
  couchdb2_data:
  postgres_ca_org1_data:
  postgres_ca_org2_data:
  postgres_ca_org3_data:
  postgres_ca_orderer_data:
  ca_org1_data:
  ca_org2_data:
  ca_org3_data:
  ca_orderer_data:
