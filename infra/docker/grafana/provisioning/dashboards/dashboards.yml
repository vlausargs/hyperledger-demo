apiVersion: 1

providers:
  - name: 'hlf-dashboards'
    orgId: 1
    folder: 'HLF Supply Chain'
    folderUid: hlf-supply-chain
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
