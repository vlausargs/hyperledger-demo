{{- if .Values.orderer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric.fullname" . }}-orderer
  labels:
    {{- include "fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: orderer
spec:
  replicas: {{ .Values.orderer.replicas }}
  selector:
    matchLabels:
      {{- include "fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orderer
  template:
    metadata:
      labels:
        {{- include "fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orderer
    spec:
      containers:
        - name: orderer
          image: "{{ .Values.orderer.image.repository }}:{{ .Values.orderer.image.tag }}"
          imagePullPolicy: {{ .Values.orderer.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.orderer.service.port }}
            - name: admin
              containerPort: {{ .Values.orderer.service.adminPort }}
            - name: operations
              containerPort: {{ .Values.orderer.service.operationsPort }}
          env:
            - name: ORDERER_GENERAL_LISTENADDRESS
              value: "0.0.0.0"
            - name: ORDERER_GENERAL_LISTENPORT
              value: "{{ .Values.orderer.service.port }}"
            - name: ORDERER_GENERAL_LOCALMSPID
              value: "OrdererMSP"
            - name: ORDERER_GENERAL_TLS_ENABLED
              value: "true"
            - name: ORDERER_METRICS_PROVIDER
              value: "prometheus"
          resources:
            {{- toYaml .Values.orderer.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/hyperledger/production/orderer
      volumes:
        - name: data
          {{- if .Values.orderer.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fabric.fullname" . }}-orderer
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
