apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fabric.fullname" . }}-peer
  labels:
    {{- include "fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: peer
spec:
  serviceName: {{ include "fabric.fullname" . }}-peer
  replicas: {{ .Values.peers.replicas }}
  selector:
    matchLabels:
      {{- include "fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: peer
  template:
    metadata:
      labels:
        {{- include "fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: peer
    spec:
      containers:
        - name: peer
          image: "{{ .Values.peers.image.repository }}:{{ .Values.peers.image.tag }}"
          imagePullPolicy: {{ .Values.peers.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.peers.service.port }}
            - name: chaincode
              containerPort: {{ .Values.peers.service.chaincodePort }}
            - name: operations
              containerPort: {{ .Values.peers.service.operationsPort }}
          env:
            - name: CORE_PEER_LISTENADDRESS
              value: "0.0.0.0:{{ .Values.peers.service.port }}"
            - name: CORE_LEDGER_STATE_STATEDATABASE
              value: "CouchDB"
            - name: CORE_PEER_TLS_ENABLED
              value: "true"
            - name: CORE_METRICS_PROVIDER
              value: "prometheus"
          resources:
            {{- toYaml .Values.peers.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/hyperledger/production
  {{- if .Values.peers.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.peers.persistence.size }}
  {{- end }}
