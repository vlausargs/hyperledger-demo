apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  WALLET_PATH: {{ .Values.config.walletPath | quote }}
  TLS_CERT_PATH: {{ .Values.config.tlsCertPath | quote }}
  CONNECTION_PROFILE: {{ .Values.config.connectionProfile | quote }}
