replicaCount: 2

image:
  repository: ghcr.io/myindo/hlf-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Pinned so the Service is reachable at a predictable in-cluster DNS name
# ("api", not the default "<release>-<chart>" fullname) — the web chart's
# default API_URL (http://api:8080) depends on this.
fullnameOverride: api

service:
  type: NodePort
  port: 8080
  # Only honored by the service template when type is NodePort.
  nodePort: 30948

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  CHANNEL_ID: mychannel
  CHAINCODE_ID: basic
  MSP_ID: Org1MSP
  GIN_MODE: release
  # Dev-only static secret for signing the hardcoded-credential login JWT
  # (see packages/api/internal/service/auth.go) — not Fabric crypto material,
  # fine to keep in the chart's plaintext ConfigMap for this demo cluster.
  JWT_SECRET: hlf-kind-dev-jwt-secret
  CORS_ALLOWED_ORIGIN: http://localhost:30949

# Paths the api binary reads at startup (packages/api/internal/config,
# packages/api/internal/fabric/connector.go):
#   - tlsCertPath is actually the client identity's MSP dir: connector.go's
#     loadIdentity() reads <tlsCertPath>/signcerts/cert.pem and
#     <tlsCertPath>/keystore/priv_sk directly (not a wallet lookup).
#   - connectionProfile is the fabric-gateway connection-profile YAML
#     (ConnectionProfile struct in connector.go), generated by
#     60-apps.sh from operator-issued material and stored in the
#     `connectionSecretName` Secret.
#   - identitySecretName reuses the operator's org1-admin FabricIdentity
#     secret (keys cert.pem/key.pem) directly — remapped onto the
#     signcerts/keystore layout via the Secret volume's `items[].path`.
#   - walletPath just needs to be a writable dir (fabric.NewGateway
#     MkdirAlls it); it is not actually read back for identity loading.
config:
  walletPath: /wallet
  tlsCertPath: /crypto/identity
  connectionProfile: /crypto/connection/connection-profile.yaml
  connectionSecretName: api-connection
  identitySecretName: org1-admin
