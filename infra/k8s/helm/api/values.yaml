replicaCount: 2

image:
  repository: ghcr.io/myindo/hlf-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  CHANNEL_ID: mychannel
  CHAINCODE_ID: basic
  MSP_ID: Org1MSP
  GIN_MODE: release

config:
  walletPath: /crypto/wallet
  tlsCertPath: /crypto
  connectionProfile: /crypto/connection-profile.yaml
