name: Build & Push Images

# Builds and publishes Docker images to GitHub Container Registry (GHCR)
# whenever code lands on main, or on manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Re-run the critical CI gates before producing publishable images.
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build-api:
    name: Build & push API image
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          REPO="ghcr.io/${{ github.repository }}/hlf-api"
          echo "tags=${REPO}:${{ github.sha }},${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfiles/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=hlf-api
          cache-to: type=gha,mode=max,scope=hlf-api

  build-web:
    name: Build & push Web image
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          REPO="ghcr.io/${{ github.repository }}/hlf-web"
          echo "tags=${REPO}:${{ github.sha }},${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build & push Web
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfiles/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=hlf-web
          cache-to: type=gha,mode=max,scope=hlf-web

  summary:
    name: Image summary
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Print
        run: |
          echo "API:  ${{ needs.build-api.outputs.image }}"
          echo "Web:  ${{ needs.build-web.outputs.image }}"
