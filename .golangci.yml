# golangci-lint configuration
# Applied to all Go modules in this repo (api, chaincode, configloader).
# Run locally: golangci-lint run ./...

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/myindo/hlf-supply-chain
  errcheck:
    check-type-assertions: true
    check-blank: false

issues:
  exclude-rules:
    # Tests often ignore errors intentionally
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
